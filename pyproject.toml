[project]
name = "nebula-insurance-brain-tooling"
version = "0.0.0"
description = "Nebula Insurance Brain planning and knowledge-graph tooling dependencies (runtime packages live under engine/ and neuron/)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["scripts/validation/tests", "scripts/kg/tests"]
