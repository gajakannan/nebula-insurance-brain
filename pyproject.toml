[project]
name = "nebula-insurance-brain-tooling"
version = "0.0.0"
description = "Nebula Insurance Brain planning and knowledge-graph tooling dependencies (runtime packages live under engine/ and neuron/)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
# Optional executor for the teaching RDF/OWL/SHACL bundles (scripts/validation/validate_semantic_rdf.py).
# Planning tooling only; the product runtime takes no RDF dependency.
semantic-rdf = ["rdflib==7.1.4", "pyshacl==0.30.1", "owlrl==7.1.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["scripts/validation/tests", "scripts/kg/tests"]
