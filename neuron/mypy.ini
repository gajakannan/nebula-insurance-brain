[mypy]
python_version = 3.13
mypy_path = packages/brain-ingestion/src:packages/brain-extraction/src:packages/brain-interpretation/src
files = packages/brain-ingestion/src,packages/brain-extraction/src,packages/brain-interpretation/src,tests
namespace_packages = True
explicit_package_bases = True
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = True

; Third-party libraries without published type stubs (F0001-S0003).
[mypy-docling.*]
ignore_missing_imports = True
[mypy-docling_core.*]
ignore_missing_imports = True
[mypy-pypdf.*]
ignore_missing_imports = True
[mypy-tiktoken.*]
ignore_missing_imports = True

[mypy-docling_graph.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True
