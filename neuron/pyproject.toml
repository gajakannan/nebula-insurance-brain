[project]
name = "brain-neuron-workspace"
version = "0.0.0"
description = "uv workspace root for the neuron/ AI runtime (F0001-S0001). No source of its own; see packages/*."
requires-python = ">=3.13"
dependencies = ["brain-ingestion", "brain-interpretation", "brain-extraction"]

[tool.uv]
package = false

[tool.uv.sources]
brain-ingestion = { workspace = true }
brain-interpretation = { workspace = true }
brain-extraction = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "reportlab>=4.0",
  "pypdfium2>=4.0",
]

[tool.pytest.ini_options]
# Every package under packages/*, plus the root tests/, ships its own tests/ directory —
# the default prepend import mode collides on the shared bare module name "tests" once
# more than one is collected in the same run (F0001-S0003/S0004). importlib mode keys
# each test module by its file path instead, so the collision never occurs.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
