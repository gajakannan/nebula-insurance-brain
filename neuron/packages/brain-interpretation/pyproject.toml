[project]
name = "brain-interpretation"
version = "0.1.0"
description = "Provider-neutral InterpretationResult model, run recording, and counters (F0001-S0003)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
