[project]
name = "brain-assertions"
version = "0.1.0"
description = "Structural admission and eligibility for versioned source assertions."
requires-python = ">=3.13"
dependencies = ["brain-domain", "brain-contracts", "brain-security", "brain-content"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_assertions = ["py.typed"]
