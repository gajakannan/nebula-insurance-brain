[project]
name = "brain-security"
version = "0.1.0"
description = "Credential verification, principal resolution, Casbin authorization, and decision audit (F0001-S0006 access part)."
requires-python = ">=3.13"
dependencies = [
  "pyjwt[crypto]>=2.9",
  "casbin>=1.40",
  "brain-domain",
]

[tool.uv.sources]
brain-domain = { workspace = true }

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_security = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
