[project]
name = "brain-ontology"
version = "0.1.0"
description = "Offline ontology authoring validation, release compile and the release lifecycle commands (F0012, ADR-0081)."
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "brain-contracts",
  "brain-domain",
  "brain-security",
  "brain-persistence",
]

[tool.uv.sources]
brain-contracts = { workspace = true }
brain-domain = { workspace = true }
brain-security = { workspace = true }
brain-persistence = { workspace = true }

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_ontology = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
