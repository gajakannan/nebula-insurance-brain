[project]
name = "brain-review"
version = "0.1.0"
description = "ReviewItem routing, review batch assembly, and the ReviewDecision transaction (F0001-S0004)."
requires-python = ">=3.13"
dependencies = [
  "brain-domain",
]

[tool.uv.sources]
brain-domain = { workspace = true }

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_review = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
