[project]
name = "brain-content"
version = "0.1.0"
description = "Content-artifact storage ports and the local filesystem adapter (ADR-0059, F0001-S0002)."
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_content = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
