[project]
name = "brain-jobs"
version = "0.1.0"
description = "Fenced document jobs and transactional completion outbox."
requires-python = ">=3.13"
dependencies = ["sqlalchemy>=2.0.52", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_jobs = ["py.typed"]
