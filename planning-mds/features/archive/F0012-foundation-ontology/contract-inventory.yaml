feature: F0012
status: Phase B approved (plan run 2026-11-25-120320e9); source_sha256_at_design filled at feature G0 (run 2026-11-26-54387a08)
existing_bundle: brain-contracts/v1
runtime_policy: The feature action copies each resource below into scripts/contracts/sources.yaml and regenerates
  the root snapshot, installed bundle, generated Pydantic, AJV assets and OpenAPI snapshot with the shipped F0011
  toolchain. Entries use the sources.yaml field set. `planned` marks a path the feature run creates; it becomes
  `existing` in sources.yaml once that file exists. source_sha256_at_design is filled at feature G0 from the
  approved source file.
resources:
