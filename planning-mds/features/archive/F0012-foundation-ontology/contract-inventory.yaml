  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_ontology.authoring.validate_module
    path: engine/packages/brain-ontology/src/brain_ontology/authoring.py
    state: planned
  compatibility_tests:
  - path: engine/packages/brain-ontology/tests/test_authoring.py
    state: planned
  version_selector: authoring_schema is the constant ontology-module-authoring/v1; any other value is refused.
  wire_profile: portable-json/v1
  integration_notes: Validated after YAML load and after the retired-field pre-check (parent → AUTHORING_FIELD_RETIRED).
    Semantic checks (identity, references, constructs) run in Python after schema validation.
