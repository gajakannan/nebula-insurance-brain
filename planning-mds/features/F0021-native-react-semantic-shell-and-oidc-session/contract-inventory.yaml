feature: F0021
status: Phase B design (plan run 2026-11-27-6cda122a); source_sha256_at_design recorded at Phase B and re-checked at feature G0
existing_bundle: brain-contracts/v1
runtime_policy: The feature action copies each resource below into scripts/contracts/sources.yaml, merges
  bff-api-design.yaml into planning-mds/api/brain-api.yaml (0.7.0), and regenerates the root snapshot, installed
  bundle, generated Pydantic, AJV assets and OpenAPI snapshot with the shipped F0011 toolchain. `planned` marks a path
  the feature run creates; it becomes `existing` in sources.yaml once that file exists.
resources:
- name: browser-session-v1
  version: '1'
  id: https://nebula.local/schemas/browser-session-v1.schema.json
  source: planning-mds/schemas/browser-session-v1.schema.json
  source_sha256_at_design: e0f1c3f3b6f1f5a628477e9d41fe68e81808f5ffdb27e7eb563b91b2c3f13b30
  owner: session
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_api.routes.session.get_session (output guard)
    path: engine/apps/api/src/brain_api/routes/session.py
    state: planned
  - entry_point: experience shell session store (generated AJV validator)
    path: experience/src/shell/session/sessionStore.ts
    state: planned
  compatibility_tests:
  - path: engine/apps/api/tests/test_session_routes.py
    state: planned
  - path: experience/src/shell/session/__tests__/sessionStore.test.ts
    state: planned
  version_selector: contract is the constant browser-session/v1; any other value is refused by the shell.
  wire_profile: portable-json/v1
  integration_notes: Generated Pydantic model is the response model; the shell validates every GET /session body with the generated AJV validator and treats a failure as the retryable error state (S0006 edge case), never as signed out.
- name: active-knowledge-base-update-v1
  version: '1'
  id: https://nebula.local/schemas/active-knowledge-base-update-v1.schema.json
  source: planning-mds/schemas/active-knowledge-base-update-v1.schema.json
  source_sha256_at_design: df86fc026b6b2947c703e59f4b6eb3fe4e0aa1961feaf33122fa092d22306ae4
  owner: session
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_api.routes.session.set_active_knowledge_base (input guard)
    path: engine/apps/api/src/brain_api/routes/session.py
    state: planned
  compatibility_tests:
  - path: engine/apps/api/tests/test_session_routes.py
    state: planned
  version_selector: contract is the constant active-knowledge-base-update/v1.
  wire_profile: portable-json/v1
  integration_notes: Membership is re-read in the same request; a non-member pair returns 422 knowledge_base_not_available and leaves the session unchanged.
- name: logout-result-v1
  version: '1'
  id: https://nebula.local/schemas/logout-result-v1.schema.json
  source: planning-mds/schemas/logout-result-v1.schema.json
  source_sha256_at_design: a99139b38c10f0b8a70a42803391b5bdef1be1ef45f469ec33ba1140ec13cdd2
  owner: session
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_api.routes.auth.sign_out (output guard)
    path: engine/apps/api/src/brain_api/routes/auth.py
    state: planned
  - entry_point: experience shell sign-out action
    path: experience/src/shell/session/signOut.ts
    state: planned
  compatibility_tests:
  - path: engine/apps/api/tests/test_auth_logout.py
    state: planned
  - path: experience/src/shell/session/__tests__/signOut.test.ts
    state: planned
  version_selector: contract is the constant logout-result/v1.
  wire_profile: portable-json/v1
  integration_notes: The conditional schema forbids a reason on success and requires one on failed/not_attempted, so a failed revocation cannot be serialized as success.
openapi_changes:
- source: planning-mds/features/F0021-native-react-semantic-shell-and-oidc-session/bff-api-design.yaml
  target: planning-mds/api/brain-api.yaml
  change: Add the Session tag, five BFF paths, the sessionCookie security scheme, the CsrfToken and ActivityHint
    parameters and the AmbiguousCredentials, SessionUnauthenticated, CsrfRejected and RateLimited responses; add
    sessionCookie as an alternative scheme on /reviews/*, /content/* and /facts/*. Bump info.version to 0.7.0.
  state: planned
