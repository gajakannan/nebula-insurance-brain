feature: F0012
status: Phase B design (plan run 2026-11-25-120320e9); pending approval
existing_bundle: brain-contracts/v1
runtime_policy: The feature action copies each resource below into scripts/contracts/sources.yaml and regenerates
  the root snapshot, installed bundle, generated Pydantic, AJV assets and OpenAPI snapshot with the shipped F0011
  toolchain. Entries use the sources.yaml field set. `planned` marks a path the feature run creates; it becomes
  `existing` in sources.yaml once that file exists. source_sha256_at_design is filled at feature G0 from the
  approved source file.
resources:
- name: ontology-module-authoring-v1
  version: '1'
  id: https://nebula.local/schemas/ontology-module-authoring-v1.schema.json
  source: planning-mds/schemas/ontology-module-authoring-v1.schema.json
  owner: ontology
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_ontology.authoring.validate_module
    path: engine/packages/brain-ontology/src/brain_ontology/authoring.py
    state: planned
  compatibility_tests:
  - path: engine/packages/brain-ontology/tests/test_authoring.py
    state: planned
  version_selector: authoring_schema is the constant ontology-module-authoring/v1; any other value is refused.
  wire_profile: portable-json/v1
  integration_notes: Validated after YAML load and after the retired-field pre-check (parent → AUTHORING_FIELD_RETIRED).
    Semantic checks (identity, references, constructs) run in Python after schema validation.
- name: ontology-release-manifest-v1
  version: '1'
  id: https://nebula.local/schemas/ontology-release-manifest-v1.schema.json
  source: planning-mds/schemas/ontology-release-manifest-v1.schema.json
  owner: ontology
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_ontology.compiler.compile_release (output guard)
    path: engine/packages/brain-ontology/src/brain_ontology/compiler.py
    state: planned
  - entry_point: brain_persistence.ontology_releases.OntologyReleaseStore.install (input guard)
    path: engine/packages/brain-persistence/src/brain_persistence/ontology_releases.py
    state: planned
  compatibility_tests:
  - path: engine/packages/brain-ontology/tests/test_compiler.py
    state: planned
  - path: engine/tests/integration/test_ontology_release_install.py
    state: planned
  version_selector: contract is the constant ontology-release-manifest/v1.
  wire_profile: portable-json/v1
  integration_notes: Install recomputes manifest_digest from content and refuses a mismatch before any row is written.
- name: ontology-impact-report-v1
  version: '1'
  id: https://nebula.local/schemas/ontology-impact-report-v1.schema.json
  source: planning-mds/schemas/ontology-impact-report-v1.schema.json
  owner: ontology
  disposition: adopt
  consumer_entry_points:
  - entry_point: brain_ontology.impact.build_report (output guard before persistence)
    path: engine/packages/brain-ontology/src/brain_ontology/impact.py
    state: planned
  compatibility_tests:
  - path: engine/packages/brain-ontology/tests/test_impact.py
    state: planned
  - path: engine/tests/integration/test_ontology_activation.py
    state: planned
  version_selector: contract is the constant ontology-impact-report/v1.
  wire_profile: portable-json/v1
  integration_notes: status complete forbids unresolved items, unclassified changes and an unresolved inference result
    (schema allOf). Tenant/KB come from the authorized scope, never from the wire.
retained_boundaries:
- fact-slot-key-v1: unchanged; release-backed predicate keys use the existing grammar.
- fact-temporal-v1: unchanged; temporal_kind enum already includes EVENT and ETERNAL.
- canonical-commit-request / canonical-commit-response: unchanged shapes; new typed refusal reasons
  KIND_SHAPE_MISMATCH and ETERNAL_CONFLICT are added to the existing temporal reason enumeration only if that
  enumeration is schema-closed (checked at G0).
