# Authored expectations for the account-scoped Cedar Bridge cases on production foundation IRIs
# (F0012-S0003 AC7). Rows are copied from ../expected-results.yaml; policy-dependent rows stay with F0013.
status: synthetic-authored-expectations
release: ontology/releases/foundation/1
cases: [EX-PC-001, EX-PC-011, EX-PC-015, EX-PC-017, EX-PC-021]
scope: document-to-graph teaching fixtures on foundation@1; no Nebula runtime, eligibility or access decision
inferences:
  # nebula-tbox-subset/v1 over release.ttl: subClassOf is reflexive-transitive.
  expected:
  - [foundation.person, subClassOf, foundation.party]
  - [foundation.person, subClassOf, foundation.thing]
  - [foundation.account, subClassOf, foundation.role-scope]
  - [foundation.role-assignment, subClassOf, foundation.role]
  # Domain and range never infer a type (S0001 AC6): a node that only uses a property stays untyped.
  forbidden_types:
  - [EX-PC-GAP-UNTYPED, foundation.account]
  - [EX-PC-GAP-UNTYPED-TARGET, foundation.account]
shacl:
- {shape: shapes.ttl, data: snapshot.ttl, conforms: true}
- {shape: shapes.ttl, data: boundaries/self-parent.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/parent-cycle.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/ownership-over-100.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/two-parent-accounts.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/duplicate-organization-account.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/role-scope-not-member.ttl, conforms: false}
- {shape: shapes.ttl, data: boundaries/account-close-reopen.ttl, conforms: true}
- {shape: shapes.ttl, data: boundaries/jv-designated-parent.ttl, conforms: true}
queries:
- file: queries/ownership.rq
  case: EX-PC-015
  rows:
  - [EX-PC-HOLDINGS, '60.00', EX-PC-ACCOUNT, 'true']
  - [EX-PC-RIDGE, '40.00', EX-PC-ACCOUNT-RIDGE, 'false']
  forbidden:
  - ['*', '*', '*', 'majority']
- file: queries/account-team.rq
  case: EX-PC-017
  rows:
  - [EX-PC-BROKER-CONTACT, 'urn:nebula:ont:foundation.role-kind.broker-contact', EX-PC-ACCOUNT, EX-PC-BROKER-RIVERSIDE]
  - [EX-PC-BROKER-CONTACT, 'urn:nebula:ont:foundation.role-kind.broker-contact', EX-PC-ACCOUNT-WORKSHOP, EX-PC-BROKER-RIVERSIDE]
  - [EX-PC-BROKER-CONTACT-HQ, 'urn:nebula:ont:foundation.role-kind.broker-contact', EX-PC-ACCOUNT-CONTRACTOR, EX-PC-BROKER]
  - [EX-PC-RISK-MANAGER, 'urn:nebula:ont:foundation.role-kind.risk-manager', EX-PC-ACCOUNT, EX-PC-HOLDINGS]
  - [EX-PC-RISK-MANAGER, 'urn:nebula:ont:foundation.role-kind.account-contact', EX-PC-ACCOUNT-WORKSHOP, EX-PC-HOLDINGS]
  forbidden:
  - ['*', '*', EX-PC-TERM-UMBRELLA, '*']
  - ['*', '*', EX-PC-SUBMISSION, '*']
- file: queries/account-status.rq
  case: EX-PC-001/EX-PC-021
  rows:
  - [EX-PC-ACCOUNT, EX-PC-HOLDINGS, 'urn:nebula:ont:foundation.account-status.current']
  - [EX-PC-ACCOUNT-CONTRACTOR, EX-PC-CONTRACTOR, 'urn:nebula:ont:foundation.account-status.current']
  - [EX-PC-ACCOUNT-RIDGE, EX-PC-RIDGE, 'urn:nebula:ont:foundation.account-status.current']
  - [EX-PC-ACCOUNT-WORKSHOP, EX-PC-WORKSHOP, 'urn:nebula:ont:foundation.account-status.current']
