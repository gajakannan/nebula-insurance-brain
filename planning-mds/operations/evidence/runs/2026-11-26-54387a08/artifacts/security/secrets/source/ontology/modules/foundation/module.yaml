constraints:
- id: foundation.constraint.one-parent-account
  construct: maxCardinality
  subject: foundation.account
  stage: example-validation
  consumer: semantic-examples gate
  applicability: account snapshot at one valid/known coordinate
  severity: violation
  on_nonconformance: fail the example
  data_basis: asserted
  property: foundation.account.parent-account
  value: 1
- id: foundation.constraint.no-parent-cycle
  construct: custom
  subject: foundation.account
  stage: canonical-admission
  consumer: F0017/F0018 canonical admission
  applicability: designated parent chain at one coordinate
  severity: violation
  on_nonconformance: refuse the commit
  data_basis: asserted
  property: foundation.account.parent-account
  expression: An account is never its own parent or ancestor.
- id: foundation.constraint.percentage-range
  construct: custom
  subject: foundation.ownership-interest
  stage: canonical-admission
  consumer: F0017/F0018 canonical admission
  applicability: every supplied percentage
  severity: violation
  on_nonconformance: refuse the malformed value
  data_basis: asserted
  property: foundation.ownership-interest.percentage
  expression: 0 < percentage <= 100.
- id: foundation.constraint.percentage-total
  construct: custom
  subject: foundation.organization
  stage: canonical-admission
  consumer: F0017/F0018 canonical admission
  applicability: recorded ownership of one organization at one valid/known coordinate
  severity: violation
  on_nonconformance: refuse the commit that would exceed 100
  data_basis: asserted
  expression: Recorded percentages for one owned organization total at most 100; less is allowed when owners are
    unknown.
- id: foundation.constraint.one-current-account
  construct: custom
  subject: foundation.organization
  stage: canonical-admission
  consumer: F0017/F0018 canonical admission
  applicability: all knowledge bases of one tenant at one valid/known coordinate
  severity: violation
  on_nonconformance: refuse the second current account
  data_basis: asserted
  expression: At most one account with status CURRENT per organization per tenant; missing or unknown status cannot
    satisfy this check.
- id: foundation.constraint.one-account-organization
  construct: maxCardinality
  subject: foundation.account
  stage: authoring
  consumer: foundation compiler
  applicability: every account
  severity: violation
  on_nonconformance: refuse the release
  data_basis: asserted
  property: foundation.account.organization
  value: 1
- id: foundation.constraint.role-scope-range
  construct: range
  subject: foundation.role-assignment
  stage: authoring
  consumer: foundation compiler
  applicability: every role-assignment scope declaration
  severity: violation
  on_nonconformance: refuse the release
  data_basis: asserted
  property: foundation.role-assignment.scope
