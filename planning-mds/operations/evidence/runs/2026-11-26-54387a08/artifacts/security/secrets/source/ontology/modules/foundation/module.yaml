# F0012 foundation module (ADR-0081). Authored against ontology-module-authoring/v1.
# Source: feature design draft foundation-module-design.yaml (plan run 2026-11-25-120320e9). Feature run
# 2026-11-26-54387a08 made references repository-relative so each one resolves (S0001 AC3).
# PartyRoleTypeCode status: 'existing' appears in nebula-insurance-data-contracts today; 'proposed' comes from the
# cross-repo account plan; 'unmapped' has no code yet.
authoring_schema: ontology-module-authoring/v1
module:
  id: foundation
  version: 1
  predicate_namespace: fnd
  dependencies: []
terms:
- id: foundation.thing
  kind: class
  labels:
    en-US: Thing
  definition: The root of every foundation class; anything the Brain can describe with evidence.
  parents: []
  examples:
  - planning-mds/domain/glossary.md
  regression_cases:
  - planning-mds/architecture/master-blueprint.md
- id: foundation.party
  kind: class
  labels:
    en-US: Party
  definition: A person or an organization capable of participating in a scoped insurance relationship.
  parents:
  - foundation.thing
  examples:
  - planning-mds/examples/commercial-pc-account/records.json
  regression_cases:
  - planning-mds/examples/commercial-pc-account/cases.md
- id: foundation.person
  kind: class
  labels:
    en-US: Person
  definition: An individual human party; a role played in insurance does not make the person an application principal.
  parents:
  - foundation.party
  examples:
  - planning-mds/examples/commercial-pc-account/records.json
  regression_cases:
  - planning-mds/examples/commercial-pc-account/cases.md
- id: foundation.organization
  kind: class
  labels:
    en-US: Organization
  definition: An identified organization. Broker, carrier, MGA and insured are roles it plays in a scope, not kinds
    of organization.
  parents:
  - foundation.party
  examples:
  - planning-mds/examples/commercial-pc-account/records.json
  regression_cases:
  - planning-mds/examples/commercial-pc-account/cases.md
- id: foundation.place
  kind: class
  labels:
    en-US: Place
  definition: A location such as an office, premises or yard at which an organization operates; operating there
    does not make it insured property.
  parents:
  - foundation.thing
  examples:
  - planning-mds/examples/commercial-pc-account/records.json
  regression_cases:
  - planning-mds/examples/commercial-pc-account/cases.md
- id: foundation.document
  kind: class
  labels:
