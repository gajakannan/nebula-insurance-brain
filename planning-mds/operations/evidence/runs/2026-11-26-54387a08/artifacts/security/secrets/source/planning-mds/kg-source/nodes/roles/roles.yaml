roles:
- id: role:tenant-member
  label: TenantMember
  notes: Verified user principal with a current membership in a tenant and knowledge base; reads content artifacts,
    review tasks, and facts in that scope.
  source_docs:
  - F0001/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
  related_nodes:
  - entity:principal
- id: role:reviewer
  label: Reviewer
  notes: Verified user principal; reviews evidence in the native Review Panel as its own session principal and may
    annotate review tasks in scope; annotation is not canonical approval (sections 111.2, 125).
  source_docs:
  - F0001/F0001-S0004-proof-native-review-round-trip.md
  - F0001/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
  related_nodes:
  - entity:principal
  - entity:review-decision
- id: role:service-principal
  label: ServicePrincipal
  notes: Worker identity for ingestion and the commit proof; commits facts in the fixture scope; never annotates.
  source_docs:
  - F0001/F0001-S0005-proof-bitemporal-commit.md
  - F0001/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
  related_nodes:
  - entity:principal
- id: role:ontology-steward
  label: OntologySteward
  notes: F0012 (ADR-0081 D5). Human domain steward who reviews ontology impact reports and activates or rolls back
    releases in one tenant/KB; holds no grant outside ontology_release and gains nothing from vocabulary data.
  source_docs:
  - planning-mds/architecture/decisions/ADR-0081-foundation-ontology-authoring-and-release-runtime.md
  related_nodes:
  - entity:principal
  - capability:foundation-ontology-release
