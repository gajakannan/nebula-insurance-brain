notes:
- 'Requirement-ownership amendment 2026-11-08 - Carry master blueprint 107.4 and ADR-0039 into the PRD: information
  state (eight states) is separate from the value, NOT_FOUND/NOT_STATED carry the exact scope searched, and access
  denial is never an information state. Values use qualified money (exact decimal, ISO 4217 currency, basis) and
  scoped identifiers (scheme, type, value).'
- 'Requirement-ownership amendment 2026-11-08 - Carry 109.1: define FactSlot identity beyond the first scalar example
  (multi-valued, qualified and relationship slots). FactSlot keys are the predicate key referenced by the ADR-0038
  SourceAuthorityPolicy owned by F0018.'
- Requirement-ownership amendment 2026-11-08 - New tenant-owned tables bind child rows and foreign keys to tenant
  ownership and follow the ADR-0042 row-security pattern settled in F0018 Phase B.
- 'Plan run 2026-11-09-60865e32 G1 decisions: F0007 binds ownership only and hands the RLS inventory (fact_slot,
  fact_slot_qualifier) to F0018; predicate keys are opaque and versioned with a minimal sys namespace; display-name
  precedence is deferred to F0017/F0023.'
- 'Phase B (Proposed ADR-0077): MULTI members are child fact_slot rows so the ADR-0008 exclusion applies per member
  with no DDL on the F0008-owned canonical_fact_version; answers use the fact-answer/v1 envelope in its value for
  identity-v1 slots only. Pilot slots stay legacy and the pilot GET contract is unchanged.'
- As-built code/test bindings reconciled by Architect at G7 in planning-mds/operations/evidence/runs/2026-11-09-b94cfa12/kg-reconciliation.md;
  archive path/status and generated trackers are PM G8 ownership.
- 'G3 security review fixed SEC-F7-01 (name evidence READ before reason), SEC-F7-02 (T-08 on the answer read path)
  and SEC-F7-03 (cross-KB evidence oracle). Residual: slot restrictions fixed at creation (F0018 re-derivation);
  envelope DB backstop (F0008); name-hook per-slot authorization cost is a design note for F0017/F0023.'
- Operator authorized targeted remediation of review findings; the prior archive is reopened, with no new producer,
  route, permission or ontology scope.
