id: entity:fact-slot
label: Fact slot
notes: 'Canonical semantic identity of one fact about an entity (for example the EachOccurrence limit of a coverage);
  the parent of bitemporal fact versions. F0007 refinement (ADR-0077, implemented in run 2026-11-09-b94cfa12, migration 0012): identity-v1 rows add an opaque versioned
  predicate key, cardinality, optional relationship object and MULTI member children; pilot rows stay legacy with NULL
  identity and no fabricated predicate.'
