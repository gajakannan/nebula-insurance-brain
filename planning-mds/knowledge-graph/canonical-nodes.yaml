capabilities:
  - id: capability:authorization-enforcement
    label: Authorization enforcement
    notes: Native Casbin adapter over typed, server-hydrated resource attributes with structural tenancy
      resolved first; every decision audited with policy hash, grant revision, and reason code; denials
      never disclose existence.
    related_nodes:
      - adr:0050
      - entity:audit-event
      - policy_rule:content-artifact-read
      - policy_rule:fact-slot-commit
      - policy_rule:fact-slot-read
      - policy_rule:review-task-annotate
      - policy_rule:review-task-read
    source_docs:
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/PRD.md
  - id: capability:backup-and-restore
    label: Backup and restore
    notes: Timed backup of relational state, content objects, artifact manifests, and review evidence,
      restored to a fresh stack with every citation verified (section 114.3).
    related_nodes:
      - capability:evidence-review-round-trip
      - capability:parse-once-content-artifact
    source_docs:
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/PRD.md
  - id: capability:bitemporal-canonical-commit
    label: Bitemporal canonical commit
    notes: Section 109.2 commit algorithm over FactSlots with two-range GiST exclusion, split intervals,
      explicit change reasons, and facts plus audit plus outbox in one transaction (ADR-0007, ADR-0008,
      ADR-0009).
    related_nodes:
      - endpoint:fact-commit
      - endpoint:fact-get
      - entity:canonical-fact-version
      - entity:fact-slot
      - entity:outbox-event
      - schema:canonical-commit-request
      - schema:canonical-commit-response
      - workflow:canonical-commit
    source_docs:
