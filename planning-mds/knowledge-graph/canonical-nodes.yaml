entities:
  - id: entity:assertion
    label: Assertion
    notes: What a source, system, model, or person claims, with evidence bindings and interpretation basis;
      never truth by itself; versioned so review decisions can detect staleness.
    related_entities:
      - entity:review-decision
      - entity:semantic-interpretation-run
    related_nodes:
      - capability:semantic-interpretation-run
      - entity:review-item
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0003-proof-parse-once-reinterpret-evidence.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0004-proof-native-review-round-trip.md
  - id: entity:assessment-record
    label: Assessment record
    notes: Append-only result of applying one guideline rule version to exact canonical inputs at explicit
      valid and known coordinates. Records outcome and reason codes from the closed vocabulary MEETS_GUIDELINE,
      BELOW_GUIDELINE, UNKNOWN, CONFLICT, NOT_APPLICABLE, plus input fact-version IDs, rule and ontology
      releases, evaluator version, semantic snapshot, acting principal, audit reference, evidence and
      derivation links, and the typed comparison when one was performed. Tenant/knowledge-base scoped
      and stored outside the canonical fact plane; it is never promoted to a canonical fact and is not
      a policy approval. Authorization failures and invalid definitions are errors, not recorded outcomes.
    related_entities:
      - entity:assertion
      - entity:audit-event
      - entity:canonical-fact-version
      - entity:guideline-rule-version
      - entity:principal
    related_nodes:
      - adr:0026
      - adr:0056
      - capability:authorization-enforcement
      - capability:grounded-gl-guideline-assessment
      - workflow:guideline-assessment
    source_docs:
      - planning-mds/architecture/decisions/ADR-0026-derived-facts-have-dependency-lineage.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/F0065-S0003-preserve-assessment-lineage.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/F0065-S0004-temporal-reassessment.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/assessment-contract.md
  - id: entity:audit-event
    label: Audit event
    notes: 'Append-only record of authorization decisions, commits, and review decisions: actor and delegate,
      resource, action, decision, reason code, policy hash, grant revision, trace id.'
    related_entities:
      - entity:principal
    related_nodes:
      - capability:authorization-enforcement
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0005-proof-bitemporal-commit.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
  - id: entity:canonical-fact-version
    label: Canonical fact version
    notes: Accepted value for a fact slot with valid and recorded ranges, change reason, evidence references,
      commit id, and the four separately stored timestamps; overlap prevented by a two-range GiST exclusion.
    related_entities:
      - entity:fact-slot
      - entity:outbox-event
    related_nodes:
      - capability:bitemporal-canonical-commit
      - schema:canonical-commit-response
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0005-proof-bitemporal-commit.md
  - id: entity:content-artifact
    label: Content artifact
    notes: 'Immutable parse-once bundle for one document version: docling-document.json, normalized.md,
      blocks.jsonl, tables.jsonl, layout.jsonl, manifest.json with per-file sha256 and execution record.'
    related_entities:
      - entity:semantic-interpretation-run
    related_nodes:
      - capability:parse-once-content-artifact
      - schema:content-artifact-manifest
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0003-proof-parse-once-reinterpret-evidence.md
  - id: entity:fact-slot
    label: Fact slot
    notes: Canonical semantic identity of one fact about an entity (for example the EachOccurrence limit
      of a coverage); the parent of bitemporal fact versions.
    related_entities:
      - entity:canonical-fact-version
    related_nodes:
      - capability:bitemporal-canonical-commit
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0005-proof-bitemporal-commit.md
  - id: entity:guideline-rule-version
    label: Guideline rule version
    notes: Immutable reviewed release of one bounded guideline. Carries rule identity, version, ontology
      release, guideline source and approved authority references, tenant/knowledge-base scope, effective
      interval, coverage type, limit basis, currency, the single v0.1 operation money_gte_minimum, and
      an exact decimal minimum. A changed minimum produces a new release; installation is a separately
      authorized administrative act with an audit record. Selection is verified against known_as_of and
      valid_as_of, so a later release is never applied to an earlier question.
    related_entities:
      - entity:assessment-record
      - entity:audit-event
      - entity:principal
    related_nodes:
      - adr:0056
      - capability:authorization-enforcement
      - capability:grounded-gl-guideline-assessment
      - workflow:guideline-assessment
    source_docs:
      - planning-mds/architecture/decisions/ADR-0056-bounded-neurosymbolic-assessment.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/F0065-S0001-versioned-guideline-rule.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/assessment-contract.md
  - id: entity:outbox-event
    label: Outbox event
    notes: Transactional outbox row written with every canonical commit and consumed idempotently by projectors;
      carries commit id and processed watermark.
    related_entities:
      - entity:canonical-fact-version
    related_nodes:
      - capability:bitemporal-canonical-commit
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0005-proof-bitemporal-commit.md
  - id: entity:principal
    label: Principal
    notes: Verified identity (user, service, or agent) mapped from (issuer, subject) to a stable internal
      id, with current memberships per tenant and knowledge base and a grant revision.
    related_entities:
      - entity:audit-event
    related_nodes:
      - capability:credential-verification-and-principal-resolution
      - role:reviewer
      - role:service-principal
      - role:tenant-member
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
  - id: entity:review-decision
    label: Review decision
    notes: Governed outcome of a review (ACCEPT, CORRECT, REJECT) bound to the authenticated reviewer
      principal, the decision event hash, and the assertion version; corrections append a new assertion
      linked to the original. BLOCKED records unresolved evidence and is not an adjudication (ADR-0058).
    related_entities:
      - entity:assertion
      - entity:principal
      - entity:review-item
    related_nodes:
      - capability:evidence-review-round-trip
      - schema:review-decision
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0004-proof-native-review-round-trip.md
  - id: entity:review-item
    label: Review item
    notes: Nebula-owned unit of human adjudication for a low-confidence or corrected assertion; carries
      the assertion version, its review batch, and the evidence locator the panel renders from.
    related_entities:
      - entity:assertion
      - entity:review-decision
    related_nodes:
      - capability:evidence-review-round-trip
      - workflow:human-review
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0004-proof-native-review-round-trip.md
  - id: entity:semantic-interpretation-run
    label: Semantic interpretation run
    notes: Versioned execution of an extraction profile over a content artifact; records run configuration,
      counters, status (complete, partial, failed), and the external provenance ledger.
    related_entities:
      - entity:assertion
      - entity:content-artifact
    related_nodes:
      - capability:semantic-interpretation-run
      - schema:interpretation-result
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0003-proof-parse-once-reinterpret-evidence.md
