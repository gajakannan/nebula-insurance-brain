      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/PRD.md
  - id: capability:grounded-gl-guideline-assessment
    label: Grounded GL guideline assessment
    notes: Proposed v0.1B bounded on-demand comparison; planned, not implemented. Exact canonical input/rule
      versions, temporal snapshot, evidence lineage, and current authorization. The single operation is
