workflows:
  - id: workflow:canonical-commit
    label: Canonical commit lifecycle
    rationale:
      - adr: adr:0008
        section: Decision
        summary: Authorize, lock, validate ranges, split intervals, commit facts with audit and outbox
          in one transaction, then project idempotently (sections 109.2, 109.3).
    related_nodes:
      - capability:authorization-enforcement
      - capability:bitemporal-canonical-commit
      - entity:canonical-fact-version
      - entity:outbox-event
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0005-proof-bitemporal-commit.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0006-proof-access-boundaries-extension-build-and-restore.md
    states:
      - id: state:canonical-commit:proposed
        label: Proposed
        transitions_to:
          - state:canonical-commit:authorized
          - state:canonical-commit:rejected
      - id: state:canonical-commit:authorized
        label: Authorized
        transitions_to:
          - state:canonical-commit:committed
      - id: state:canonical-commit:committed
        label: Committed
        transitions_to:
          - state:canonical-commit:projected
      - id: state:canonical-commit:projected
        label: Projected
        transitions_to: []
      - id: state:canonical-commit:rejected
        label: Rejected
        transitions_to: []
  - id: workflow:guideline-assessment
    label: Guideline assessment lifecycle
    rationale:
      - adr: adr:0056
        section: Decision
        summary: Bounded on-demand assessment. Request validity, rule-release availability, and authorization
          are resolved before any business outcome is disclosed; the comparison itself is deterministic
          exact-decimal arithmetic over accepted canonical facts read from one consistent snapshot, with
          no model call.
      - adr: adr:0026
        section: Decision
        summary: The recorded result carries the exact input fact versions it derived from, so the derivation
          is reconstructable without re-running interpretation.
    related_nodes:
      - capability:authorization-enforcement
      - capability:bitemporal-canonical-commit
      - capability:grounded-gl-guideline-assessment
      - entity:assessment-record
      - entity:canonical-fact-version
      - entity:guideline-rule-version
    source_docs:
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/F0065-S0002-evaluate-accepted-facts.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/F0065-S0003-preserve-assessment-lineage.md
      - planning-mds/features/F0065-grounded-gl-guideline-assessment/assessment-contract.md
    states:
      - id: state:guideline-assessment:requested
        label: Requested
        transitions_to:
          - state:guideline-assessment:authorized
          - state:guideline-assessment:rejected
      - id: state:guideline-assessment:rejected
        label: Rejected
        transitions_to: []
      - id: state:guideline-assessment:authorized
        label: Authorized
        transitions_to:
          - state:guideline-assessment:snapshot-resolved
          - state:guideline-assessment:denied
      - id: state:guideline-assessment:denied
        label: Denied
        transitions_to: []
      - id: state:guideline-assessment:snapshot-resolved
        label: Snapshot resolved
        transitions_to:
          - state:guideline-assessment:evaluated
      - id: state:guideline-assessment:evaluated
        label: Evaluated
        transitions_to:
          - state:guideline-assessment:recorded
      - id: state:guideline-assessment:recorded
        label: Recorded
        transitions_to: []
  - id: workflow:human-review
    label: Human review round trip
    rationale:
      - adr: adr:0057
        section: Boundary
        summary: Nebula renders the evidence and owns the decision inside one trust boundary; a stale
          assertion version reopens the item instead of applying (sections 75, 111.1, 125).
      - adr: adr:0058
        section: Proposed decision
        summary: Evidence that cannot be re-anchored blocks the decision with EVIDENCE_UNRESOLVED rather
          than resolving to an approximate region (section 125.4).
    related_nodes:
      - capability:evidence-review-round-trip
      - entity:review-decision
      - entity:review-item
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0004-proof-native-review-round-trip.md
    states:
      - id: state:human-review:open
        label: Open
        transitions_to:
          - state:human-review:in-review
      - id: state:human-review:in-review
        label: In review
        transitions_to:
          - state:human-review:decided
          - state:human-review:stale
          - state:human-review:blocked
      - id: state:human-review:stale
        label: Stale assertion version
        transitions_to:
          - state:human-review:in-review
      - id: state:human-review:blocked
        label: Evidence unresolved
        transitions_to:
          - state:human-review:in-review
      - id: state:human-review:decided
        label: Decided
        transitions_to: []
  - id: workflow:ingestion-interpretation
    label: Ingestion and interpretation lifecycle
    rationale:
      - adr: adr:0003
        section: Decision
        summary: Each document version is parsed once; interpretation runs read the persisted artifact
          and a failed page yields a partial run, never a negative assertion (sections 5, 86, 108.3).
    related_nodes:
      - capability:parse-once-content-artifact
      - capability:semantic-interpretation-run
      - entity:content-artifact
      - entity:semantic-interpretation-run
    source_docs:
      - planning-mds/architecture/master-blueprint.md
      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/F0001-S0003-proof-parse-once-reinterpret-evidence.md
    states:
      - id: state:ingestion-interpretation:received
        label: Received
        transitions_to:
          - state:ingestion-interpretation:parsed
          - state:ingestion-interpretation:failed
      - id: state:ingestion-interpretation:parsed
        label: Parsed once
        transitions_to:
          - state:ingestion-interpretation:interpreted
          - state:ingestion-interpretation:partial
      - id: state:ingestion-interpretation:partial
        label: Partially interpreted
        transitions_to:
          - state:ingestion-interpretation:interpreted
      - id: state:ingestion-interpretation:interpreted
        label: Interpreted
        transitions_to: []
      - id: state:ingestion-interpretation:failed
        label: Failed
        transitions_to: []
