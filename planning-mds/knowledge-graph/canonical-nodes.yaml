      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/PRD.md
  - id: capability:evidence-review-round-trip
    label: Evidence review round trip
    notes: ReviewItem routing into a review batch, rendering and anchor resolution in the native Review
      Panel, duplicate and stale rejection, blocked decisions on unresolved evidence, and a governed ReviewDecision
      with correction lineage (ADR-0057, ADR-0058, ADR-0037).
    related_nodes:
      - endpoint:review-decisions-submit
      - endpoint:review-item-get
      - entity:review-decision
      - entity:review-item
      - schema:review-decision
      - workflow:human-review
    source_docs:
