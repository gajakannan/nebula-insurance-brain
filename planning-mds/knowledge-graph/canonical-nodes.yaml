      - planning-mds/features/archive/F0001-repository-and-engineering-foundation/PRD.md
  - id: capability:credential-verification-and-principal-resolution
    label: Credential verification and principal resolution
    notes: OIDC token verification (issuer, audience, signature, expiry) before any storage read; verified
      (issuer, subject) mapped to a stable internal principal with current memberships.
    related_nodes:
      - adr:0049
      - entity:principal
      - role:reviewer
      - role:service-principal
      - role:tenant-member
    source_docs:
