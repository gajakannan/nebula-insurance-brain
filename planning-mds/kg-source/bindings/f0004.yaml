# Architect as-built bindings, F0004 G7, run 2026-10-17-8a6cc79f.
# Existing parse-once package globs and ops/** coverage remain in f0001.yaml.
# F0005 G7 (run 2026-10-25-4020923b) appended as-built paths for capability:versioned-content-contracts.
