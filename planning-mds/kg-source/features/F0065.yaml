notes:
- Ontology bound at plan run 2026-09-07-38aed4ad (G4, PHASE=A+B, FEATURE_MODE=existing). Planning bindings only;
  no runtime exists and no story has started.
- Endpoint, policy_rule, and runtime DTO schema nodes are deliberately not declared. brain-api.yaml has no
  assessment path, policy.csv has no assessment resource/action pair (declaring one would fail the Casbin drift
  check), and no assessment request/result schema file exists. All three are open decisions in the assembly plan
  and bind in the implementation run that authors them.
- Only the UI story requires F0021–F0023; the evaluator requires the canonical kernel and temporal reads.
- Fractional roadmap order places F0065 after the F0023 base view and before F0024 integration without renumbering existing entries.
