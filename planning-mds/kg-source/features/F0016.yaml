notes:
- Learning traces are projected from run records (proposed ADR-0072). Keep run outcomes queryable by run with a terminal status. No new v0.1 scope.
- Requirement-ownership amendment 2026-11-08 - ADR-0060 was Rejected on 2026-11-08; runs use the direct-baseline
  pipeline and record pipeline identity for any future backend.
- Requirement-ownership amendment 2026-11-08 - Carry master blueprint 110.4 (untrusted inputs) - extracted
  text is evidence, never instruction. Acceptance - a PDF instructing a limit change or another account
  disclosure produces no tool action, cross-account retrieval or canonical mutation. Extraction workers
  hold no business-write credentials; run metadata stores secret references only.
- Requirement-ownership amendment 2026-11-08 - Carry 110.4 model routing - v0.1 inference is local only
  (ADR-0055); a timeout never falls back to another provider. Carry 114.2 - record stage latency, pages/blocks,
  tokens, retries and cost per run without sensitive text.
- Requirement-ownership amendment 2026-11-08 - Carry 107.4 - each run records the scope it interpreted
  so NOT_PROCESSED and NOT_FOUND are scoped. Carry the 88 embedding-abstraction hook as a port with no
  adapter (F0033 implements it).
