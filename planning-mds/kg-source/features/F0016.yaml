rationale: Semantic interpretation runs version every extraction over persisted content and are the unit
  of incremental reinterpretation (sections 28, 29). Each run records pipeline, profile and model identity
  and the exact scope it interpreted.
validation_gate: F0004, F0005, F0006 and F0015 complete; plan action Phase A and Phase B approved for this feature.
