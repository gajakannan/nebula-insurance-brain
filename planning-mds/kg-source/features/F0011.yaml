id: feature:F0011
name: JSON Schema contract system
path: planning-mds/features/F0011-json-schema-contract-system
status: planned
registry_section: Planned
phase: v0.1A
roadmap_section: Now
roadmap_order: 1
rationale: "Now (2026-11-20 roadmap review): continues as the contract/ontology lane;\
  \ dependencies done (F0001, F0006); heads F0011 \u2192 F0012 \u2192 F0013/F0014\
  \ \u2192 F0015 \u2192 F0016, the longest v0.1 chain to F0065. Owns the ADR-0039\
  \ typed-value and missingness schemas (section 106.3). JSON Schema 2020-12 is the\
  \ cross-language structural contract shared by Pydantic, AJV, and OpenAPI (sections\
  \ 25 to 27). Its migration is numbered after F0008's 0015. Plan run 2026-11-20-ccb1bd39:\
  \ Phase A approved; six stories/41 ACs; Phase A and B approved by operator on 2026-11-20;\
  \ independent plan-review next; ADR-0079 Proposed, no runtime delivered."
validation_gate: "Plan action Phase A and Phase B approved and plan-review READY (or\
  \ High findings accepted with owner and date); feature run closes G0\u2013G8 with\
  \ one JSON Schema 2020-12 source consumed by Pydantic, AJV and OpenAPI, covering\
  \ the F0007 typed-value and information-state carriers."
depends_on:
- feature:F0001
- feature:F0006
governed_by:
- adr:0013
- adr:0039
- adr:0077
- adr:0078
- adr:0079
notes:
- Phase A approved by operator reply approve at G3; Phase B approved with exact token
  approve-phase-b on 2026-11-20 in plan run 2026-11-20-ccb1bd39, after G4 and seven
  ordered G5 pre-approval exit checks. G5 post-approval regeneration/publication is
  authoritative in the journal/manifest. Six Not Started stories, 41 ACs; no runtime
  implementation. Independent plan-review is next.
- ADR-0079 selects one authored planning schema source -> generated root snapshot
  -> installed common bundle, source-gated generated Pydantic, headless AJV and shared
  OpenAPI. No new route, grant, DDL, deployable or extraction activation.
- Portable-json/v1 has declared numeric/format/resource limits; existing readers select
  native-compat/v1 before parsing and retain acceptance/reason semantics. Never fallback
  after validation failure.
- Existing FactVersion OpenAPI nested ranges were stale relative to shipped flat DTO
  fields; fact-version-read-v1 corrects documentation only. Internal review-decision
  is not the HTTP submission schema.
- Dependency evidence references for F0001/F0004/F0006/F0007/F0008 are in the run
  artifact trace; downstream consumer audits remain pending in their own runs. Runtime
  bindings/proofs are feature-action work.
- ADR-0039 stays Proposed pending both schema fixture proof and later incomplete-package
  display; ADR-0079 stays Proposed pending its runtime proofs and explicit acceptance.
