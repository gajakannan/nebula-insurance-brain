notes:
- 'Closeout 2026-11-26 (PM G8, feature run 2026-11-26-54387a08): archived. No plan-review ran (operator chose G0
  reconciliation). Operator decisions: provisioned resource_access row for ontology_release (0017 widens
  ck_resource_access_type); fact-version-read-v1 valid_start nullable for ETERNAL. Deferred lows: CR-F0012-L4/L5,
  SEC-F0012-L1..L3.'
- The commercial P&C handoff introduces a synthetic contractor account and scoped party roles. Settle the account/party/product
  representation in the PRD; non-GL examples are future breadth, not expanded delivery scope.
- Proposed ADR-0070 answers BLUEPRINT section 4.8 with one account per organization with a designated parent, percentage
  ownership, organization hierarchy, broker of record per account, scoped roles with acted-for organization, and
  exactly one owning account per policy. F0012 authors this vocabulary in Phase B.
- Planning-only bindings from the ontology prerequisite amendment; status remains planned. PRD, stories, assembly
  plan and Phase A/B approvals remain pending. Dependency evidence audit pending at formal plan.
- Authoring contract precedes vocabulary content. Stable IRIs and meaning-change classes are paired; constraint
  stage/consumer/severity/data basis and missingness are explicit. Release records are proposed in data-model.md
  under ADR-0045.
- Resolve blueprint sections 20/82 parents versus parent before authoring. The synthetic interchange examples illustrate
  proposed predicate-to-projection mappings, not a frozen schema or implemented compiler.
- Read planning-mds/architecture/ontology-planning-handoff.md for scope, deferred work and retrieval verification.
- 'Requirement-ownership amendment 2026-11-08 - Carry master blueprint 67: concept labels are language-tagged label
  metadata on one canonical concept ID; translation never duplicates knowledge. ADR-0045 decision direction recorded
  2026-11-08; F0012 is its proving feature.'
- 'Plan run 2026-11-25-120320e9 G1 operator decisions D1-D8: files+compile+DB, F0012 owns section 22 plus ADR-0070
  party/account/ownership/role (Policy/Submission/Program to F0013), inference subset subClassOf/subPropertyOf/inverseOf,
  urn:nebula:ont namespace, tenant extensions rejected, ETERNAL/EVENT activated, gated activation, parents list
  only.'
- 'Phase A approved 2026-11-25 with exact operator token approve-phase-a; Phase B approved 2026-11-25 with exact
  operator token approve-phase-b. Design: ADR-0081 (Proposed), assembly plan, foundation-module-design.yaml, migration-design.sql
  (0017), three design schemas. No implementation or feature evidence index.'
