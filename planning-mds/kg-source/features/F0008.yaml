id: feature:F0008
name: Bitemporal canonical facts
path: planning-mds/features/F0008-bitemporal-canonical-facts
status: planned
registry_section: Planned
phase: v0.1A
roadmap_section: Now
roadmap_order: 1
rationale: 'Now (2026-11-10 roadmap review): every dependency is done (F0003, F0007), and it heads the temporal/commit critical
  path F0008 → F0009 → F0010 → F0018 → F0019/F0020 → F0025. Full bitemporality with database-level overlap integrity is a
  section 115.4 pre-build proof and is required before the endorsement slice (sections 14, 15, 109.2).'
validation_gate: Plan action Phase A and Phase B approved and plan-review READY (or High findings accepted with owner and
  date); feature run closes G0–G8 with the section 115.4 bitemporal proof cases (retroactive and concurrent changes, interval
  splitting, distinct received and accepted times) passing on PostgreSQL.
depends_on:
- feature:F0003
- feature:F0007
governed_by:
- adr:0007
- adr:0008
- adr:0064
- adr:0039
- adr:0077
- adr:0078
notes:
- Cedar Bridge EX-PC-006/014 (planning-mds/architecture/commercial-pc-example-handoff.md) exercise ADR-0064 kinds, attestation
  bounds, an unknown start and an UNKNOWN end; teaching fixtures for the PRD, not acceptance evidence.
- Requirement-ownership amendment 2026-11-08 - The ADR-0039 information state is versioned bitemporally like a value; a later
  NOT_STATED or EXPLICIT_NEGATIVE supersedes NOT_PROCESSED without erasing it.
- 'Plan run 2026-11-16-208a1193 G1 decisions: store the start basis (template field or human date = grade A; grade C cannot
  close); a PRESENT value closes only to PRESENT or EXPLICIT_NEGATIVE; an unknown start with undated evidence is refused (START_UNATTESTED);
  the caller supplies an IANA zone per bound.'
- 'Phase B operator decisions 2026-11-16: reads before an attestation floor are validity-unknown (EX-PC-014-B); information
  states are exposed by the internal reader, the GET is additive and a no-version coordinate stays 404 (F0020 owns HTTP states).'
- 'Phase B approved 2026-11-17 (Proposed ADR-0078): fact-temporal/v1 columns on canonical_fact_version, an UNKNOWN end closing the exclusion range
  at the end of the attested_to period, close-only immutability triggers, remainder lineage, an envelope backstop and an additive
  migration 0014; RELATIONSHIP slot versions share the table. Runtime not claimed.'
