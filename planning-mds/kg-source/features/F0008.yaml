- Requirement-ownership amendment 2026-11-08 - The ADR-0039 information state is versioned bitemporally like a value; a later
  NOT_STATED or EXPLICIT_NEGATIVE supersedes NOT_PROCESSED without erasing it.
- 'Plan run 2026-11-16-208a1193 G1 decisions: store the start basis (template field or human date = grade A; grade C cannot
  close); a PRESENT value closes only to PRESENT or EXPLICIT_NEGATIVE; an unknown start with undated evidence is refused (START_UNATTESTED);
  the caller supplies an IANA zone per bound.'
- 'Phase B operator decisions 2026-11-16: reads before an attestation floor are validity-unknown (EX-PC-014-B); information
  states are exposed by the internal reader, the GET is additive and a no-version coordinate stays 404 (F0020 owns HTTP states).'
- 'Phase B approved 2026-11-17 (Proposed ADR-0078): fact-temporal/v1 columns on canonical_fact_version, an UNKNOWN end closing the exclusion range
  at the end of the attested_to period, close-only immutability triggers, remainder lineage, an envelope backstop and an additive
  migration 0014; RELATIONSHIP slot versions share the table. Runtime not claimed.'
- As-built code/test bindings reconciled by Architect at G7 in planning-mds/operations/evidence/runs/2026-11-17-1a4ae2f0/kg-reconciliation.md;
  archive path/status and generated trackers are PM G8 ownership.
- 'Second remediation closeout 2026-11-19 (run 2026-11-19-8cfcd0ff): review 2026-11-19-b21ec2de SEC-F8-NEW-01 fixed; prior run 2026-11-18-bce4909b superseded.'
