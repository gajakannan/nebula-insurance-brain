rationale: 'Now (2026-11-20 roadmap review): takes the Now slot freed by F0008, as the 2026-11-10 review promised; its only
  dependency, F0002, is done and the ADR-0051 session-transport decision is recorded. An independent UI lane, de-risking F0022
  (native review round trip, a section 115.4 pre-build proof) and F0023. The native React semantic shell with the OIDC session
  contract and safe re-auth behavior is the first user-facing surface (section 3, 120.5).'
validation_gate: F0002 complete; plan action Phase A and Phase B approved and plan-review READY (or High findings accepted
  with owner and date); feature run closes G0–G8 with the OIDC session contract and safe re-auth behavior proven.
depends_on:
- feature:F0002
governed_by:
- adr:0036
- adr:0049
- adr:0051
- adr:0072
- adr:0082
notes:
- Provide the route, feature-flag and lazy-load seam that F0067 uses; app-wide state, caching and styling choices are made here, not in F0067.
- Requirement-ownership amendment 2026-11-08 - ADR-0051 decision recorded 2026-11-08 - same-origin BFF
  with an opaque HttpOnly session cookie, server-held tokens and renewal, CSRF and origin checks, and
  upstream revocation on logout. No browser token storage. Formal acceptance needs section 121.2 items
  8 and 9.
- 'Plan run 2026-11-27-6cda122a G1 operator decisions D1-D4: 30m idle / 8h absolute server-enforced; shell + Home/memberships
  + narrowing active-KB selector + route/flag/lazy seam + Review Panel rehosted behind the cookie; popup re-auth with
  explicit re-confirmation; 20 rejected credentials per client per 60 s then 429.'
- 'Phase A approved 2026-11-27 (nine stories, 55 ACs). Phase B drafted 2026-11-27: ADR-0082 (Proposed) refines ADR-0051;
  assembly plan, bff-api-design.yaml, migration-design.sql (0018), contract-inventory.yaml and three design schemas.
  Phase B approved 2026-11-27 with exact operator token approve-phase-b, confirming R1 (denials stay 404) and R2 (local verification while throttled).'
- 'Plan review 2026-11-27-d1148686 CONDITIONALLY READY (5 High, 1 Medium). Rework run 2026-11-28-831962b8 (A+B): Phase A approved
  2026-11-28 (PM-01 status/error layouts, S0005 AC7 end-session outcomes, S0008 read-only throttle, S0009 Chromium + Firefox,
  R1/R2 wording applied); Phase B fixes ARCH-01 (encrypted CSRF secret), ARCH-02 (end reason decides session_expired),
  ARCH-03 (end-session return route, 2-minute unconfirmed bound), BUILD-01, BUILD-02. Phase B rework approved
  2026-11-28 with exact operator token approve-phase-b.'
