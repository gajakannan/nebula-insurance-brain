rationale: 'Proposed ADR-0071 and ADR-0072: make recorded answer traces and learning runs inspectable and replayable
  on demand, read-only, from the trace contract carried into F0016, F0036 to F0038, F0041 and F0042. Placed after
  the learning plane, governance and review queues it projects from.'
validation_gate: Every drawn node and edge maps to a recorded event or an authoritative record; "used in answer" comes
  only from the ADR-0046 answer basis; a learning trace rebuilt from records matches the cached one; no unauthorized
  node, edge, label or count after grant revocation; no write path; answer and run unaffected when the Observatory fails.
