id: entity:review-decision
label: Review decision
notes: Governed outcome of a review (ACCEPT, CORRECT, REJECT) bound to the authenticated reviewer principal, the
  decision event hash, and the assertion version; corrections append a new assertion linked to the original.
  BLOCKED records unresolved evidence and is not an adjudication (ADR-0058).
