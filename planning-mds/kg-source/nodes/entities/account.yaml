id: entity:account
label: Insurance account
notes: >-
  The customer relationship with exactly one organization seeking or holding coverage, and
  the root of Account 360 (proposed ADR-0070). One account per organization in a tenant, with
  at most one designated parent account for roll-up; the parent is designated, not computed
  from ownership. A policy has no owning account and reaches each account through its
  organization's named-insured role, so one policy can appear under several accounts. Account
  parentage and ownership never imply named-insured status or tenant/KB authorization; an
  account-scoped grant reaches only that account (ADR-0062 scope amendment pending). F0012
  owns the representation, F0017 account versus organization identity, F0023 Account 360. No
  fictional Cedar Bridge instance belongs in the planning KG.
