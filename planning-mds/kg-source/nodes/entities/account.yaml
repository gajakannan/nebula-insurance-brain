id: entity:account
label: Insurance account
notes: Glossary baseline is the business entity seeking or holding coverage and the root of Entity
  360. The Cedar Bridge example proposes an account that groups several legal organizations, with
  named-insured status held by policy-term role assignments. Which model applies, and whether an
  account-scoped grant follows the grouping or the named insureds, is an open decision in BLUEPRINT
  section 4.8 (F0012 representation, ADR-0062 scope, F0017 identity, F0023 Entity 360 root). Account
  membership never implies named-insured status or tenant/KB authorization. No fictional Cedar Bridge
  instance belongs in the planning KG.
