id: entity:account
label: Insurance account
notes: >-
  The carrier's customer relationship with exactly one insured organization, and the root of
  Account 360 (proposed ADR-0070). One account per organization in a tenant, with at most one
  designated parent account for roll-up; the parent is designated, not computed from
  ownership. Each account has a dated broker of record and broker contacts; brokers are
  organizations, not accounts. Each policy belongs to exactly one account, normally the first
  named insured's; other named insureds stay roles on the term, and a master program's local
  policies link to it. Parentage and ownership never imply named-insured status. External
  people reach only the accounts they hold an authoritative role on, never the parent or
  siblings; carrier staff see all and act by role (F0002-successor amendment pending). F0012
  owns the representation, F0017 account versus organization identity, F0023 Account 360. No
  fictional Cedar Bridge instance belongs in the planning KG.
