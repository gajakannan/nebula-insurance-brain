id: entity:insurance-party
label: Insurance party (organization or person)
notes: >-
  A person or an organization (proposed ADR-0070). Insured, broker, carrier, MGA and
  underwriter are scoped roles a party plays, not party types. Organizations form an
  effective-dated hierarchy with no fixed depth (a brokerage's branches and offices, a
  company's divisions), operate at locations, and employ people; employment is separate from
  any role. Names are time-bounded claims (ADR-0066). Aligns with the canonical Party and
  PartyRelationship contracts. Distinct from an authenticated application principal.
