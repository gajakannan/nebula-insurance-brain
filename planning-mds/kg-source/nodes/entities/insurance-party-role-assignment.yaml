id: entity:insurance-party-role-assignment
label: Scoped insurance party role
notes: >-
  A party acting as named insured, broker of record, placement broker, broker contact, risk
  manager, account contact, carrier, MGA or underwriter in an explicit account, submission or
  policy-term scope, with the organization or branch a person acts for (proposed ADR-0070).
  Broker of record is account-scoped and dated; a placement broker on a term can override it
  for one line. One person can hold roles on several accounts. Once confirmed by an
  authoritative source, a role decides an external person's reach (their own accounts only)
  and a carrier employee's decision rights; a role read from a document grants nothing. The
  access check is a proposed F0002-successor amendment to ADR-0062. Evidence and temporal context remain
  mandatory. F0012/F0013 settle production representation; the example establishes no
  delegation authority or runtime schema.
