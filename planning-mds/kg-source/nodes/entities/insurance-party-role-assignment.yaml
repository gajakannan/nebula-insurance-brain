id: entity:insurance-party-role-assignment
label: Scoped insurance party role
notes: >-
  A party acting as named insured, servicing or placement broker, broker contact, risk
  manager, account contact, carrier, MGA or underwriter in an explicit account, submission or
  policy-term scope, with the organization or branch a person acts for (proposed ADR-0070).
  Broker of record is a policy-term scope, so it can differ by line and term. One person can
  hold roles on several accounts. These domain roles are not authorization roles or grants;
  they show who does what for Account 360 and routing. Evidence and temporal context remain
  mandatory. F0012/F0013 settle production representation; the example establishes no
  delegation authority or runtime schema.
