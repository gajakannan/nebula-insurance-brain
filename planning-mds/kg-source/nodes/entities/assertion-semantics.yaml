id: entity:assertion-semantics
label: Assertion semantic extension
notes: Implemented immutable one-to-one v2 extension keyed to the existing assertion ID, retaining the complete
  source record, independent dimensions, verified evidence/source hashes and scoped reference/time snapshots.
  PostgreSQL deferred integrity mirrors carrier and evidence coordinates, and v2 corrections own their extension/evidence
  while inheriting basis. It is not a second assertion identity or canonical fact.
