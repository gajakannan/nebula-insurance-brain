id: entity:canonical-fact-version
label: Canonical fact version
notes: Accepted value for a fact slot with valid and recorded ranges, change reason, evidence references, commit id, and the
  four separately stored timestamps; overlap prevented by a two-range GiST exclusion. F0008 design (Proposed ADR-0078) adds
  nullable fact-temporal/v1 columns (granularity/zone per bound, start basis, end state, attestation dates, validity_unknown_from,
  split_of_version_id) and close-only immutability triggers; RELATIONSHIP slot versions live here (no separate relationship-version
  table).
