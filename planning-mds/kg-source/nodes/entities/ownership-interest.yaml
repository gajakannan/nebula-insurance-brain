id: entity:ownership-interest
label: Organization ownership interest
notes: >-
  One party's percentage interest in an organization, with valid time (proposed ADR-0070).
  Any number of owners (60/40, 50/50, four equal owners); majority ownership is computed,
  never stored. The designated parent account is set separately and is at most one, so a
  joint venture is never rolled up twice; without a majority owner it is normally a root
  account, listed as an ownership interest on each owner's Account 360. Ownership never
  merges identities or implies named-insured status.
