id: entity:ownership-interest
label: Organization ownership interest
notes: >-
  One party's percentage interest in an organization, with valid time (proposed ADR-0070).
  An organization can have several owners; majority ownership is computed, never stored. A
  joint venture's owners need not match its designated parent account, which is set
  separately. Ownership never merges identities or implies named-insured status.
