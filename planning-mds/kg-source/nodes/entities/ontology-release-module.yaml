id: entity:ontology-release-module
label: Ontology release module membership
notes: Proposed exact release-to-module-version membership. A release selects one version per module; dependencies
  resolve within that locked composition at exact versions and digests. Floating latest dependencies cannot define
  a reproducible release. Physical persistence remains a Phase B decision. F0012 Phase B (ADR-0081, Proposed) settles
  the physical design in migration-design.sql (0017); not implemented.
