id: entity:assessment-record
label: Assessment record
notes: Append-only result of applying one guideline rule version to exact canonical inputs at explicit valid and
  known coordinates. Records outcome and reason codes from the closed vocabulary MEETS_GUIDELINE, BELOW_GUIDELINE,
  UNKNOWN, CONFLICT, NOT_APPLICABLE, plus input fact-version IDs, rule and ontology releases, evaluator version,
  semantic snapshot, acting principal, audit reference, evidence and derivation links, and the typed comparison
  when one was performed. Tenant/knowledge-base scoped and stored outside the canonical fact plane; it is never
  promoted to a canonical fact and is not a policy approval. Authorization failures and invalid definitions are
  errors, not recorded outcomes.
