id: capability:browser-session-bff
label: Same-origin BFF browser session
notes: 'Proposed in F0021 Phase B (ADR-0082, refining ADR-0051). The engine API signs users in with authorization code + PKCE against the confidential authentik brain client, holds tokens server-side (encrypted), issues an opaque __Host-nebula_session cookie, enforces CSRF and origin checks on unsafe cookie requests, renews once per burst under a row lock, enforces 30-minute idle and 8-hour absolute limits, revokes upstream on logout with a truthful outcome, records the IdP end-session outcome (completed, failed or unconfirmed) through a BFF return route, maps timeout-ended sessions to session_expired, keeps one encrypted CSRF secret per session, and serves the session endpoint with memberships, grant revision, active knowledge base and flags. The bearer path is unchanged.'
