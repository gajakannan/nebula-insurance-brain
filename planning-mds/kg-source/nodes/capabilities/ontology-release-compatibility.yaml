id: capability:ontology-release-compatibility
label: Ontology release compatibility analysis
notes: ADR-0045 contract Proposed; the F0012 share is implemented. Historical reproducibility uses pinned releases and
  exact inputs. Consumer compatibility also covers constraints, applicability, profiles and evidence obligations.
  Bounded conservativity is one input; unsupported or undecided is not a pass. F0012/F0013 settle contracts; F0030/F0062
  add later tooling. First-assessment lineage is already required by F0065/ADR-0026 and must not wait for these
  tools. See the handoff for formal plan prerequisites. F0012 feature run 2026-11-26-54387a08 (ADR-0081, Proposed) implements the predecessor-to-candidate
  impact report (nebula-tbox-subset/v1 closure and constraint diffs, reach, unexamined populations) and reviewed,
  audited activation/rollback; extended reasoning remains F0030/F0062.
