id: capability:ontology-release-compatibility
label: Ontology release compatibility analysis
notes: Proposed contract and future tooling, not implemented. Historical reproducibility uses pinned
  releases and exact inputs. Consumer compatibility also covers constraints, applicability, profiles and
  evidence obligations. Bounded conservativity is one input; unsupported or undecided is not a pass.
  F0012/F0013 settle contracts; F0030/F0062 add later tooling. First-assessment lineage is already required
  by F0065/ADR-0026 and must not wait for these tools. See the handoff for formal plan prerequisites.
