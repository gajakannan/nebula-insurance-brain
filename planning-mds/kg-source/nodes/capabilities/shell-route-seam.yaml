id: capability:shell-route-seam
label: Shell route, flag and lazy-load seam
notes: 'Proposed in F0021 Phase B (ADR-0082 D12, ADR-0072 carry-in). One registry of {path, flag key, lazy module}; flags come from server configuration through the session endpoint; flagged-off or unknown routes render not-found without fetching their chunk; each lazy route builds to its own chunk under a 180 kB gzip entry budget. F0022, F0023 and F0067 register routes here and inherit the shell stack.'
