id: capability:credential-rejection-throttle
label: Rejected-credential throttle
notes: 'Proposed in F0021 Phase B (ADR-0082 D9, operator decision D4). Per-client fixed 60-second windows counted by an atomic PostgreSQL upsert: the first 20 rejected credentials are answered and recorded as today, the 21st writes one rate_limited authentication_event, later ones get 429 with Retry-After and no row. Applies to bearer rejections, unknown or ended session cookies and sign-in callback failures; client key from the peer or a configured trusted proxy.'
