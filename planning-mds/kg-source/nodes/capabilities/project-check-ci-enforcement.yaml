id: capability:project-check-ci-enforcement
label: Project-check CI enforcement and setup guidance
notes: The framework-validators CI job fails closed at a framework revision without project-extension support, resolves the product context, and runs the declared checks through the shared executor at project scope, preserving evidence on failure. The CI ref and BLUEPRINT section 0 pin are advanced together (manual rule). Contributor, workspace and adoption documents record setup and status.
