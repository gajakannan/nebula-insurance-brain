id: capability:postgresql-persistence-contract
label: PostgreSQL persistence contract and migration boundary
notes: Shared PostgreSQL 18 persistence boundary. Preserves existing migration and identifier history, enforces declared
  ownership and two-axis temporal integrity at the database boundary, and routes section 78 schema ownership by
  feature and release phase. Domain-specific records are added by their owning features, not pre-created by F0003.
  The physical representation of F0002 role and permission concepts remains an explicit reconciliation item.
