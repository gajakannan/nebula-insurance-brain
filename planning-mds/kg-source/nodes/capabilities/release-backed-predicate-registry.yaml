id: capability:release-backed-predicate-registry
label: Release-backed predicate contracts and temporal-kind activation
notes: Proposed F0012 Phase B design, not implemented. PredicateContractRegistry serves sys predicates plus predicates
  of releases installed in the tenant/KB, prepared per unit of work; no fallback to the active release. Commits
  take temporal_kind from the contract (ETERNAL/EVENT over ADR-0078 D10 shapes, no DDL).
