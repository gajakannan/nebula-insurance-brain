id: capability:release-backed-predicate-registry
label: Release-backed predicate contracts and temporal-kind activation
notes: Implemented in F0012 feature run 2026-11-26-54387a08 (ADR-0081 Proposed). ReleasePredicateRegistry serves sys predicates plus predicates of releases installed in the tenant/KB, prepared per unit of work by the resolver and answer policy; no fallback to the active release; sys/test namespaces reserved. Commits take temporal_kind from the contract (ETERNAL valid (,), EVENT one period, STATE unchanged; no DDL).
