rationale:
- adr: adr:0081
  section: D6. Release-backed predicate contracts
  summary: Registry keeps the synchronous port and resolves only releases installed for the scope.
- adr: adr:0077
  section: 'D2. Predicate key: opaque, namespaced, major-versioned'
  summary: Release reference is pinned but not identity.
