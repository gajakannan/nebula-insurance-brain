id: capability:bitemporal-canonical-commit
label: Bitemporal canonical commit
notes: 'Section 109.2 commit algorithm over FactSlots with two-range GiST exclusion, split intervals, explicit change reasons,
  and facts plus audit plus outbox in one transaction (ADR-0007, ADR-0008, ADR-0009). F0008 Phase B design (Proposed ADR-0078,
  plan run 2026-11-16-208a1193; runtime not claimed) adds the fact-temporal/v1 contract for identity-v1 slots: per-bound precision
  and zone, OPEN/BOUNDED/UNKNOWN ends with attestation bounds, start-basis and state guards, close-only immutability triggers,
  remainder lineage and the fact-answer envelope backstop. As built (feature run 2026-11-17-1a4ae2f0): the commit
  service branches on the slot identity version; v1 path parses and validates bounds, derives attestation from
  F0004 selections, applies D8 guards (end revision is not succession) and writes lineage remainders; the legacy
  path keeps the pilot shape with predecessor timestamps and review linkage on remainders; migration 0014.'
