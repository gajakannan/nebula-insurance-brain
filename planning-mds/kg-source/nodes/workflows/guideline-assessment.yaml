id: workflow:guideline-assessment
label: Guideline assessment lifecycle
rationale:
- adr: adr:0056
  section: Decision
  summary: Bounded on-demand assessment. Request validity, rule-release availability, and authorization are
    resolved before any business outcome is disclosed; the comparison itself is deterministic exact-decimal
    arithmetic over accepted canonical facts read from one consistent snapshot, with no model call.
- adr: adr:0026
  section: Decision
  summary: The recorded result carries the exact input fact versions it derived from, so the derivation is
    reconstructable without re-running interpretation.
source_docs:
- F0065/assessment-contract.md
- F0065/F0065-S0002-evaluate-accepted-facts.md
- F0065/F0065-S0003-preserve-assessment-lineage.md
related_nodes:
