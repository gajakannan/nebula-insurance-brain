id: nebula-json-schema/1
status: design-approved-pending-implementation
dialect: https://json-schema.org/draft/2020-12/schema
validation_keywords:
- type
- const
- enum
- properties
- required
- additionalProperties
- propertyNames
- maxProperties
- items
- minItems
- maxItems
- uniqueItems
- contains
- minContains
- maxContains
- minimum
- maximum
- exclusiveMinimum
- minLength
- maxLength
- pattern
- format
- allOf
- anyOf
- oneOf
- if
- then
- else
- not
core_keywords:
- $schema
- $id
- $ref
- $defs
annotations:
  title: string
  description: string
  default: json; never assigned
  examples: array; never validated as input defaults
  x-nebula-concept: string
  x-nebula-display-name: string
  x-nebula-evidence-required: boolean
  x-nebula-relationship: string
  x-nebula-security-scope: string
  x-nebula-extraction-hint: string
  x-nebula-line-of-business: string
  x-nebula-document-profile: string
formats:
- uuid
- date
- date-time
- uri-reference
references: closed registered resource ids and JSON pointers only; reject missing,
  external, recursive and dynamic references; never retrieve network/file URIs
ajv_options:
  strictSchema: true
  strictNumbers: true
  strictTypes: false
  strictRequired: false
  allowUnionTypes: true
  allErrors: false
  validateFormats: true
  useDefaults: false
  coerceTypes: false
  removeAdditional: false
  ownProperties: true
limits_for_new_portable_facade:
  max_bytes_per_instance: 16777216
  max_depth: 128
  depth_definition: Every JSON value counts, including a scalar or empty container; root depth is 1.
  decoded_byte_encoding: RFC8785 canonical UTF-8; raw incoming UTF-8 has the same independent byte cap.
  max_nodes: 1000000
  max_resources: 256
  numeric_model: finite IEEE-754 binary64; exact integers only through 2^53-1; money
    and identifiers are strings
compatibility: Existing entry points select native-compat/v1 before parsing and retain
  their current format/number/input semantics; shared source and registry are reused.
  They never retry after a portable validation failure. A changed legacy acceptance
  set requires an explicit new version and approval.
